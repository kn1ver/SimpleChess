services:
  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - app-network

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/chess
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-key
      PORT: 4000
      NODE_ENV: development
    depends_on:
      - db
      - redis
    networks:
      - app-network
    volumes:
      - ./packages/server/src:/app/src:ro
      - /app/node_modules

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  redisdata: